# Version) соответствуют официально рекомендуемой конфигурации Nginx
# для Docker Registry: docker push/pull используют чанкованную передачу
# и потенциально очень крупные/долгие запросы, поэтому дефолтные
# таймауты и буферизация тела запроса на диск/в память здесь неуместны.
