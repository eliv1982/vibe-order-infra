# Bootstrap-конфигурация для registry-vibe.elivcloud.org.
#
# Docker Registry НЕЛЬЗЯ отдавать по незашифрованному HTTP из интернета
# (Basic Auth по HTTP = креды в открытом виде). Поэтому на порту 80
# сейчас нет proxy_pass на registry — только ACME challenge и заглушка.
#
# HTTPS-блок с реальным reverse proxy на Registry закомментирован и
# должен быть включён ТОЛЬКО после выпуска сертификатов для этого домена.

server {
    listen 80;
    listen [::]:80;
    server_name registry-vibe.elivcloud.org;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge (certbot будет класть сюда файлы на следующем этапе).
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Намеренно НЕ проксируем на registry по HTTP.
    location / {
        default_type text/plain;
        return 404 "registry-vibe.elivcloud.org: HTTPS ещё не настроен\n";
    }
}

