# Конфигурация для registry-vibe.elivcloud.org.
#
# HTTPS активирован: используется ТОТ ЖЕ сертификат Let's Encrypt, что
# и для vibe.elivcloud.org (один SAN-сертификат на оба домена),
# физически он лежит только под
# /etc/letsencrypt/live/vibe.elivcloud.org/ — отдельной директории
# live/registry-vibe.elivcloud.org/ на VPS нет и не будет, пока
# certbot не запускали с --cert-name отдельно. ssl_protocols задан
# один раз глобально в nginx.conf.
#
# Docker Registry по-прежнему НЕЛЬЗЯ отдавать по незашифрованному HTTP
# (Basic Auth по HTTP = креды в открытом виде) — поэтому на порту 80
# нет proxy_pass на registry, только ACME challenge и редирект.

server {
    listen 80;
    listen [::]:80;
    server_name registry-vibe.elivcloud.org;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge должен продолжать работать по HTTP —
    # certbot обращается сюда для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Локальный health-эндпоинт для Docker healthcheck — намеренно не
    # редиректится на HTTPS (см. подробное объяснение в
    # vibe.elivcloud.org.conf). Отдаёт только статичный текст "ok".
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Registry API нельзя отдавать по незашифрованному HTTP — редирект,
    # а не proxy_pass.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name registry-vibe.elivcloud.org;

    ssl_certificate     /etc/letsencrypt/live/vibe.elivcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.elivcloud.org/privkey.pem;

    client_max_body_size 0;  # загрузка крупных слоёв образов, без ограничения

    location /v2/ {
        proxy_pass http://registry:5000/v2/;

        # Обязательно для Docker Registry: chunked transfer encoding
        # (используется при push) требует HTTP/1.1.
        proxy_http_version 1.1;

        # Не буферизовать тело запроса на диске/в памяти Nginx —
        # слои образов могут быть гигабайтными, стримим напрямую.
        proxy_request_buffering off;

        # Push/pull крупных слоёв может идти дольше дефолтных 60s.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # ВАЖНО: add_header внутри location сбрасывает наследование
        # add_header из server{} (особенность Nginx) — поэтому базовые
        # security-заголовки продублированы здесь же, а не только на
        # уровне server{}.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Явно транслируем API-версию Registry — важно, если ответ
        # (например, ошибку) сформирует сам Nginx, а не upstream.
        add_header Docker-Distribution-Api-Version registry/2.0 always;

        # Basic Auth уже обеспечивается самим Registry (REGISTRY_AUTH=htpasswd),
        # дублировать auth_basic на уровне Nginx не требуется.
    }
}
