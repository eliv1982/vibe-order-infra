# Конфигурация для vibe.elivcloud.org.
#
# HTTPS активирован: сертификат Let's Encrypt уже выпущен на VPS и
# монтируется read-only из /etc/letsencrypt (см. docker-compose.yml).
# ssl_protocols задан один раз глобально в nginx.conf.
#
# Backend (FastAPI, контейнер "backend" в app-net + proxy-net) проксируется
# на 443 ТОЛЬКО по узкому allowlist конкретных /api/-эндпоинтов, нужных
# клиентскому сайту (см. location-блоки ниже) — полноценной auth на backend
# пока нет, поэтому CRUD/admin API снаружи закрыт. Swagger/OpenAPI/Redoc и
# /admin явно заблокированы до отдельного этапа auth. Главная "/" теперь
# раздаёт собранный статический frontend (frontend/dist, см.
# docker-compose.yml bind mount) с SPA-fallback на index.html.

server {
    listen 80;
    listen [::]:80;
    server_name vibe.elivcloud.org;

    # Базовые security-заголовки. HSTS сюда намеренно НЕ добавлен —
    # его включают только после реального перехода на HTTPS, иначе
    # браузер будет форсировать HTTPS на домене, который его пока не
    # обслуживает.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge должен продолжать работать по HTTP —
    # certbot обращается сюда для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Локальный health-эндпоинт для Docker healthcheck (см.
    # docker-compose.yml: wget http://127.0.0.1:80/healthz изнутри
    # контейнера). Намеренно НЕ редиректится на HTTPS — иначе
    # healthcheck зависел бы от того, поддерживает ли busybox wget в
    # образе TLS, что не проверялось (контейнеры в рамках этой сессии
    # не запускались). Наружу это не ослабляет HTTPS-схему: эндпоинт
    # отдаёт только статичный текст "ok", без чувствительных данных —
    # ровно то же самое, что было доступно и до этого патча.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Весь остальной HTTP-трафик — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vibe.elivcloud.org;

    ssl_certificate     /etc/letsencrypt/live/vibe.elivcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.elivcloud.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS сознательно НЕ включён даже здесь — добавьте
    # add_header Strict-Transport-Security ... отдельным шагом, только
    # после того, как реальный smoke-test с VPS подтвердит, что HTTPS
    # стабильно работает для обоих доменов.

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # ------------------------------------------------------------------
    # Публичный API allowlist.
    #
    # Backend сам монтирует свои роуты под префиксом /api, поэтому во всех
    # ниже proxy_pass указан БЕЗ URI-части (без завершающего "/" после
    # хоста) — это заставляет Nginx передавать исходный $request_uri без
    # изменений, т.е. /api/health -> /api/health на backend, а не /health.
    #
    # Разрешены СТРОГО эти 4 exact-match пути (без вложенных подпутей) —
    # ровно то, что нужно текущему клиентскому сайту:
    #   GET  /api/health
    #   GET  /api/admin-settings/active
    #   POST /api/applications          (без trailing slash — см. ниже)
    #   POST /api/behavior-metrics      (без trailing slash — см. ниже)
    # Метод для каждого ограничен через limit_except: любой другой метод
    # на этих путях получает 403 и НЕ доходит до backend.
    # ------------------------------------------------------------------

    location = /api/health {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin-settings/active {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Точный путь без trailing slash: backend регистрирует коллекцию как ""
    # под префиксом роутера, POST на "/api/applications/" получил бы от
    # FastAPI 307-редирект на бесслэшевый путь — здесь же он просто не
    # матчит exact location и падает в блокирующий location ниже.
    location = /api/applications {
        limit_except POST {
            deny all;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/behavior-metrics {
        limit_except POST {
            deny all;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное под /api/ — заблокировано. Exact-match location'ы выше
    # всегда имеют приоритет над этим префиксным "^~", так что 4 разрешённых
    # пути (при разрешённом методе) сюда не попадают, а любые другие
    # /api/admin-settings, /api/admin-settings/*, /api/applications/*,
    # /api/behavior-metrics/*, /api/health с неверным методом и т.д. —
    # получают 404 здесь и не идут ни на backend, ни в SPA fallback.
    location ^~ /api/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # /admin, Swagger (/docs, /openapi.json, /redoc) — публичной auth на
    # backend пока нет, поэтому эти пути закрыты Nginx целиком и НЕ падают
    # в SPA fallback (location / ниже их не увидит). Frontend-код /admin
    # может оставаться в JS-бандле — это не проблема, т.к. сам он сюда не
    # попадёт при прямом обращении, а admin CRUD API уже закрыт правилом
    # /api/ выше.
    # ------------------------------------------------------------------
    location ^~ /admin {
        return 404;
    }

    location ^~ /docs {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    # ------------------------------------------------------------------
    # Статический frontend (Vite build, frontend/dist — см. bind mount
    # в docker-compose.yml на /usr/share/nginx/html). SPA fallback: любой
    # путь, не попавший в правила выше и не найденный как файл/директория
    # в dist/, отдаёт index.html — дальше маршрутизацией занимается
    # клиентский router.ts (который сам знает про /api, /docs, /admin и
    # резолвит их в 'not-found', но сюда он не должен доходить благодаря
    # правилам выше).
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные Vite-ассеты (JS/CSS/шрифты) — если файла нет, честный
    # 404, а НЕ index.html. Без этого блока location / ниже подменял бы
    # отсутствующий /assets/<файл> на SPA index.html с HTTP 200.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
