# Bootstrap-конфигурация для vibe.elivcloud.org.
#
# Сейчас доступен ТОЛЬКО порт 80. HTTPS-блок ниже закомментирован и
# должен быть включён только после того, как сертификаты для этого
# домена реально появятся в ./nginx/certs — иначе Nginx не запустится
# из-за отсутствующих файлов ssl_certificate.
#
# Backend ещё не реализован, поэтому здесь намеренно нет proxy_pass —
# он ронял бы Nginx (upstream не резолвился бы).

server {
    listen 80;
    listen [::]:80;
    server_name vibe.elivcloud.org;

    # Базовые security-заголовки. HSTS сюда намеренно НЕ добавлен —
    # его включают только после реального перехода на HTTPS, иначе
    # браузер будет форсировать HTTPS на домене, который его пока не
    # обслуживает.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge (certbot будет класть сюда файлы на следующем этапе).
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Заглушка вместо proxy_pass на несуществующий backend.
    location / {
        default_type text/plain;
        return 200 "vibe-order-infra: bootstrap, backend ещё не подключён\n";
    }
}

