# Конфигурация для vibe.elivcloud.org.
#
# HTTPS активирован: сертификат Let's Encrypt уже выпущен на VPS и
# монтируется read-only из /etc/letsencrypt (см. docker-compose.yml).
# ssl_protocols задан один раз глобально в nginx.conf.
#
# Backend (FastAPI, контейнер "backend" в app-net + proxy-net) проксируется
# на 443 по allowlist'у /api/-префиксов (см. location-блоки ниже). Реальная
# JWT-авторизация (кто public, кто требует Bearer-токен, какие HTTP-методы
# допустимы на каждом пути) выполняется САМИМ backend (FastAPI) — Nginx
# только пропускает эти префиксы дальше и НЕ дублирует
# auth/method-матрицу. Всё, что не попало под allowlist ниже под /api/ —
# получает 404 прямо в Nginx. Swagger/OpenAPI/Redoc заблокированы отдельно
# (учебный API не должен светить схему наружу). "/admin" — SPA-роут
# собранного frontend (см. блок ниже): раздаёт index.html, backend-auth на
# самой странице выполняется client-side JS после загрузки (реальная login-
# форма ходит в /api/auth/login). Главная "/" раздаёт собранный статический
# frontend (frontend/dist, см. docker-compose.yml bind mount) с
# SPA-fallback на index.html.

server {
    listen 80;
    listen [::]:80;
    server_name vibe.elivcloud.org;

    # Базовые security-заголовки. HSTS сюда намеренно НЕ добавлен —
    # его включают только после реального перехода на HTTPS, иначе
    # браузер будет форсировать HTTPS на домене, который его пока не
    # обслуживает. X-Frame-Options здесь на будущее (эти location'ы не
    # отдают HTML), для единообразия с 443-блоком ниже, где теперь
    # публикуется /admin.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge должен продолжать работать по HTTP —
    # certbot обращается сюда для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Локальный health-эндпоинт для Docker healthcheck (см.
    # docker-compose.yml: wget http://127.0.0.1:80/healthz изнутри
    # контейнера). Намеренно НЕ редиректится на HTTPS — иначе
    # healthcheck зависел бы от того, поддерживает ли busybox wget в
    # образе TLS, что не проверялось (контейнеры в рамках этой сессии
    # не запускались). Наружу это не ослабляет HTTPS-схему: эндпоинт
    # отдаёт только статичный текст "ok", без чувствительных данных —
    # ровно то же самое, что было доступно и до этого патча.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Весь остальной HTTP-трафик — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vibe.elivcloud.org;

    ssl_certificate     /etc/letsencrypt/live/vibe.elivcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.elivcloud.org/privkey.pem;

    # Основной сайт (публичная форма заявки, behavior-metrics, auth,
    # административный API) не передаёт крупных payload'ов — реальные тела
    # запросов на порядки меньше 1 МБ. Явный лимит здесь (а не дефолт nginx)
    # документирует это намерение и не наследуется от Docker Registry — у
    # него свой собственный unlimited client_max_body_size 0, заданный на
    # уровне HTTPS server{} (443) в отдельном vhost-файле
    # conf.d/registry-vibe.elivcloud.org.conf. Этот override изолирован в
    # том server{} и не может "просочиться" сюда — у каждого server{} свой
    # server_name и свой конфиг-файл.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    # /admin теперь публикуется этим server-блоком — X-Frame-Options
    # запрещает встраивание страницы (в т.ч. login-формы) в чужой iframe
    # (clickjacking). У сайта нет легитимного сценария встраивания в
    # iframe, поэтому DENY, а не SAMEORIGIN. frame-ancestors 'none' в CSP
    # ниже — современный эквивалент того же самого; оставлены оба вместе
    # для браузеров без поддержки frame-ancestors.
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Ни geolocation, ни камера/микрофон, ни платёжный API этим сайтом не
    # используются — явный пустой allowlist на каждую фичу отключает их для
    # самой страницы и для любого (не существующего сегодня) вложенного
    # третьего лица.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy (Stage 4) — выведена из реального собранного
    # frontend (frontend/dist), а не скопирована как типовой шаблон:
    #   - script-src 'self': единственный скрипт — тот же самый
    #     собственный /assets/index-*.js (Vite build), без inline-<script>
    #     и без eval/Function() в исходниках (проверено); 'unsafe-eval' не
    #     нужен.
    #   - style-src 'self': единственный источник CSS — собственный
    #     /assets/index-*.css. inline `style="..."` (динамическая ширина
    #     бара в admin-статистике) убран из HTML/innerHTML и заменён на
    #     программную установку el.style.width через CSSOM (см.
    #     frontend/src/pages/adminAnalytics.ts::applyBarWidths) — это НЕ
    #     inline-style-атрибут и style-src его не блокирует, поэтому
    #     'unsafe-inline' здесь не нужен.
    #   - font-src 'self': шрифты (@fontsource/golos-text) собраны в
    #     frontend/dist/assets и отдаются тем же источником, никакого
    #     fonts.googleapis.com/CDN.
    #   - img-src 'self': на сайте нет ни одного <img>/background-image
    #     (проверено по frontend/src) — 'self' достаточен, ничего внешнего.
    #   - connect-src 'self': весь fetch() идёт на тот же origin, /api/...
    #     (см. frontend/src/api/client.ts) — Nginx проксирует /api/ на
    #     backend по этому же домену, никаких сторонних API.
    #   - object-src 'none', base-uri 'self': нет <object>/<embed>/<base>.
    #   - form-action 'self': единственная <form> (заявка) отправляется
    #     через fetch (event.preventDefault() в home.ts), а не реальным
    #     submit-переходом, но ограничение — разумная защита по умолчанию.
    #   - frame-src 'none', frame-ancestors 'none': сайт не встраивает и не
    #     встраивается в чужие iframe.
    # Смоук-тест собранного frontend под этой политикой — см. README, раздел
    # про Stage 4 CSP/HSTS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;

    # HSTS (Stage 4) — этот server{} блок сам по себе уже HTTPS-only (см.
    # заголовок файла: сертификат Let's Encrypt уже выпущен и подключен), а
    # порт 80 выше ничего не отдаёт, кроме ACME challenge/health и 301 на
    # HTTPS — заголовок добавлен ТОЛЬКО в этот 443-блок, никогда в
    # HTTP-ответы порта 80, где браузер ещё не подтвердил, что домен
    # обслуживается по HTTPS. max-age=180 дней (15552000s) — заметно
    # укрепляет защиту от downgrade-атак, но не привязывает браузеры
    # клиентов к HTTPS на неоправданно долгий срок, если политику придётся
    # откатывать. includeSubDomains и preload сознательно НЕ включены: у
    # elivcloud.org есть другие поддомены/сервисы (например
    # registry-vibe.elivcloud.org, который сам уже полностью HTTPS-only, но
    # не проверен и не подтверждён как часть этой политики), и preload
    # необратим без ручного исключения из browser preload list — включать
    # оба сейчас, только чтобы "звучало сильнее", было бы неоправданным
    # риском для доменов и топологии, которые эта Stage не проверяла.
    add_header Strict-Transport-Security "max-age=15552000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # ------------------------------------------------------------------
    # Финальный API allowlist (production surface) — segment-safe.
    #
    # Backend сам монтирует свои роуты под префиксом /api, поэтому во всех
    # ниже proxy_pass указан БЕЗ URI-части (без завершающего "/" после
    # хоста) — это заставляет Nginx передавать исходный $request_uri без
    # изменений, т.е. /api/auth/login -> /api/auth/login на backend, а не
    # /auth/login.
    #
    # Каждый допустимый эндпоинт покрыт РОВНО своим сегментом — либо
    # exact-match ("="), либо префикс с обязательным завершающим "/" перед
    # вложенным путём ("^~ /api/xxx/"). Это намеренно НЕ "^~ /api/xxx" без
    # слэша: такой широкий префикс совпал бы не только с "/api/xxx/..." , но
    # и с любым другим путём, который просто НАЧИНАЕТСЯ с той же строки —
    # например "^~ /api/auth" пропустил бы "/api/authentic",
    # "^~ /api/applications" пропустил бы "/api/applications-archive", и
    # т.д. Требование обязательного "/" после сегмента устраняет эти
    # ложные совпадения: "/api/applications-archive" не начинается с
    # "/api/applications/", поэтому падает в общий catch-all ниже.
    #
    # Какие пути внутри каждого сегмента существуют, какие HTTP-методы на
    # них допустимы и какие из них public/protected — решает САМ backend
    # (FastAPI route-декларации + Depends(get_current_admin) с JWT Bearer).
    # Nginx НЕ дублирует эту матрицу через limit_except — намеренно, чтобы
    # не было двух независимых источников правды об авторизации (см.
    # README, "API и публичный security allowlist"):
    #
    #   /api/health                                  GET  (public) — сам путь без подпутей, exact-match.
    #   /api/ready — Stage 3 readiness-проверка (app/main.py::readiness_check)
    #     НАМЕРЕННО не проксируется наружу: попадает в общий /api/ → 404 ниже.
    #     Используется только Docker healthcheck backend'а изнутри контейнера
    #     (см. backend/Dockerfile, backend/healthcheck.py) — публиковать её на
    #     весь интернет незачем, а её падение сигнализирует не "приложение
    #     упало", а "БД пока не готова", что не должно быть публичным сигналом.
    #   /api/auth/check                               GET  (public)
    #   /api/auth/login                                POST (public, свой строгий rate-limit — см. ниже)
    #     — публичной регистрации (/api/auth/register) в API нет: первый
    #       admin создаётся только через CLI-bootstrap (см. backend/app/cli.py,
    #       README "Порядок первого деплоя"), не через HTTP.
    #   /api/auth/me                                   GET  (protected)
    #     — exact "/api/auth" НЕ является backend-эндпоинтом и намеренно
    #       НЕ проксируется: попадает в общий /api/ → 404 ниже.
    #   /api/admin-settings           POST/GET         (protected, коллекция)
    #   /api/admin-settings/active                     GET  (public)
    #   /api/admin-settings/{id}      GET/PATCH/DELETE (protected)
    #   /api/applications              POST             (public, создание)
    #   /api/applications              GET              (protected, список)
    #   /api/applications/prioritized                  GET  (protected)
    #   /api/applications/{id}        GET/PATCH/DELETE (protected)
    #   /api/behavior-metrics          POST             (public, создание)
    #   /api/behavior-metrics          GET              (protected, список)
    #   /api/behavior-metrics/{id}    GET/PATCH/DELETE (protected)
    #   /api/analytics/overview                        GET  (protected)
    #   /api/analytics/applications/{application_id}   GET  (protected)
    #     — exact "/api/analytics" НЕ является backend-эндпоинтом и
    #       намеренно НЕ проксируется: попадает в общий /api/ → 404 ниже.
    #
    # Запрос, не совпадающий ни с одним реальным backend-роутом внутри
    # разрешённого сегмента (например, /api/applications/prioritized/x),
    # всё равно доходит до backend и получает честный 404 от самого
    # FastAPI — не проблема, т.к. Nginx здесь работает только как
    # allowlist по сегменту, а не как полноценный роутер.
    # ------------------------------------------------------------------

    # Единственный path в этом сегменте — без вложенных подпутей, поэтому
    # exact-match, а не префикс: "/api/healthcheck" не должен проксироваться.
    location = /api/health {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # POST /api/auth/login — самый строгий rate-limit во всём этом файле
    # (см. nginx.conf, "Rate limiting (Stage 1B)"): Argon2-верификация
    # пароля намеренно дорогая по CPU, поэтому именно этот путь — самая
    # лёгкая цель для online-brute-force/DoS. Exact-match ставится ВЫШЕ
    # общего "^~ /api/auth/" ниже по приоритету Nginx (exact всегда
    # выигрывает у префикса), поэтому login получает СВОЙ, более строгий
    # limit_req в дополнение к общему — остальные /api/auth/* пути
    # (/check, /me) под него не попадают.
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальные вложенные пути (/check, /me) — у сегмента /api/auth нет
    # backend-эндпоинта на самом себе (без вложенного пути), поэтому exact
    # "/api/auth" здесь намеренно НЕ объявлен и падает в общий /api/ → 404
    # ниже. "/api/authentic" не начинается с "/api/auth/" (нет "/" на этой
    # позиции), поэтому тоже не совпадает. Публичной регистрации
    # (/api/auth/register) больше нет — для несуществующего пути отдельная
    # зона не заводится (см. nginx.conf).
    location ^~ /api/auth/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Коллекция (POST создать / GET список, обе — protected) — exact,
    # плюс отдельно вложенные пути (/active, /{id}) — префикс с "/".
    # "/api/admin-settings-old" не начинается с "/api/admin-settings/",
    # поэтому не совпадает ни с одним из двух location'ов.
    location = /api/admin-settings {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin-settings/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Коллекция (POST создать — public / GET список — protected) — exact,
    # плюс вложенные пути (/prioritized, /{id}) — префикс с "/". POST сюда
    # дополнительно получает свой собственный анти-спам лимит
    # (applications_zone, см. nginx.conf) поверх общего — начиная со Stage 1B
    # correction эта зона ключуется через $post_only_limit_key (nginx.conf),
    # поэтому реально считает только POST; GET (список для админки) её не
    # трогает и ограничен только общим api_general_zone.
    # "/api/applications-archive" не совпадает ни с одним из двух.
    location = /api/applications {
        limit_req zone=applications_zone burst=5 nodelay;
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/applications/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Коллекция (POST создать — public / GET список — protected) — exact,
    # плюс вложенный /{id} — префикс с "/". POST получает свой умеренный
    # анти-спам лимит (behavior_metrics_zone) поверх общего, как и
    # /api/applications выше — тот же POST-only ключ (nginx.conf), GET
    # (список для админки) под него не попадает. "/api/behavior-metrics-old"
    # не совпадает ни с одним из двух.
    location = /api/behavior-metrics {
        limit_req zone=behavior_metrics_zone burst=10 nodelay;
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/behavior-metrics/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Только вложенные пути (/overview, /applications/{id}) — у сегмента
    # /api/analytics нет backend-эндпоинта на самом себе, поэтому exact
    # "/api/analytics" здесь намеренно НЕ объявлен и падает в общий
    # /api/ → 404 ниже (как и "/api/analytics-old").
    location ^~ /api/analytics/ {
        limit_req zone=api_general_zone burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное под /api/ — не входит в allowlist выше и получает 404
    # прямо в Nginx, не доходя до backend. Сюда попадают: неизвестные
    # префиксы (/api/unknown), похожие-но-другие сегменты без "/" после
    # разрешённого имени (/api/healthcheck, /api/authentic,
    # /api/admin-settings-old, /api/applications-archive,
    # /api/behavior-metrics-old, /api/analytics-old), exact-пути без
    # реального backend-эндпоинта на них (/api/auth, /api/analytics),
    # /api/openapi.json, и намеренно-внутренний /api/ready (Stage 3 —
    # см. пункт выше в этом списке). Nginx выбирает совпадение с максимальным
    # приоритетом (exact > самый длинный "^~"-префикс) независимо от
    # порядка блоков в файле, поэтому все exact/префиксные location'ы выше
    # всегда выигрывают у этого catch-all для своих путей.
    location ^~ /api/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # Swagger/OpenAPI/Redoc — намеренно не публикуются наружу даже после
    # включения auth: это учебный API, схема эндпоинтов не должна быть
    # видна анонимному интернету. Внутри FastAPI OpenAPI не отключен (нужен
    # для локальных тестов/разработки) — ограничение только на этом,
    # production-периметре Nginx. Exact/^~-блоки здесь стоят ВЫШЕ по
    # приоритету, чем общий location / (SPA fallback) ниже, поэтому эти
    # пути никогда не попадут в try_files и не получат 200 с index.html.
    #
    # /docs — segment-safe, как и /api/-allowlist выше: "= /docs" покрывает
    # только сам путь, "^~ /docs/" — только вложенные пути (/docs/index.html
    # и т.п.). Раньше здесь был широкий "^~ /docs" (без завершающего "/"),
    # который совпадал бы с ЛЮБЫМ путём, просто начинающимся с той же
    # строки — например с обычным frontend-роутом "/docs-archive", отдавая
    # ему 404 вместо корректного SPA fallback. Query string не мешает
    # совпадению ни в одном из двух вариантов — Nginx матчит location по
    # URI без query part.
    # ------------------------------------------------------------------
    location = /docs {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    # "/redoc" (exact, выше) не покрывает "/redoc/" — nginx считает их
    # разными URI при exact-match. Без этого блока "/redoc/" не совпал бы
    # ни с одним location выше и упал бы в общий SPA fallback (200 с
    # index.html) — отдельная exact-блокировка закрывает и этот случай.
    location = /redoc/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # /admin — SPA-роут собранного frontend. Backend admin auth (JWT) уже
    # реализован, поэтому страница публикуется: раздаёт тот же index.html,
    # что и "/", а дальше клиентский router.ts берёт на себя рендеринг
    # login/CRUD экранов и обращения к /api/auth, /api/admin-settings и
    # т.д. Nginx НЕ проксирует "/admin" на backend — это чисто статический
    # frontend-путь.
    #
    # Exact-match locations ("= /admin" и "= /admin/") — а не широкий
    # префикс ("^~ /admin" или regex) — чтобы не заводить отдельный
    # блокирующий/специальный location для более глубоких подпутей вида
    # "/admin/whatever": они сюда не попадают (exact матчит только ровно
    # "/admin" и "/admin/") и проваливаются в общий SPA fallback ниже —
    # ровно как любой другой нераспознанный frontend-путь, тем же кодом
    # 200 с index.html. Это осознанно оставлено как есть: router.ts
    # (frontend/src/router.ts) резолвит такие пути в 'not-found' на
    # клиенте, а Nginx не пытается угадывать наперёд, какие подпути под
    # /admin когда-нибудь станут валидными клиентскими роутами. Exact-match
    # здесь нужен только для того, чтобы САМИ "/admin" и "/admin/" не
    # зависели от try_files-резолвинга общего SPA fallback (совпадает
    # раньше него) — сегодня результат идентичен, но так поведение для
    # прямого refresh явное, а не побочный эффект общего правила. Query
    # string не мешает совпадению — Nginx матчит location по URI без query
    # part.
    # ------------------------------------------------------------------
    location = /admin {
        try_files /index.html =404;
    }

    location = /admin/ {
        try_files /index.html =404;
    }

    # ------------------------------------------------------------------
    # Статический frontend (Vite build, frontend/dist — см. bind mount
    # в docker-compose.yml на /usr/share/nginx/html). SPA fallback: любой
    # путь, не попавший в правила выше (включая точные "/admin"/"/admin/" и
    # заблокированные /api/, /docs, /openapi.json, /redoc) и не найденный
    # как файл/директория в dist/, отдаёт index.html — дальше
    # маршрутизацией занимается клиентский router.ts, который резолвит
    # любой нераспознанный путь в 'not-found' (200 с клиентской
    # "страницей не найдена", а не серверный 404) — это осознанное
    # текущее поведение, не изменяется в рамках этой задачи.
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные Vite-ассеты (JS/CSS/шрифты) — если файла нет, честный
    # 404, а НЕ index.html. Без этого блока location / ниже подменял бы
    # отсутствующий /assets/<файл> на SPA index.html с HTTP 200.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
