# Конфигурация для vibe.elivcloud.org.
#
# HTTPS активирован: сертификат Let's Encrypt уже выпущен на VPS и
# монтируется read-only из /etc/letsencrypt (см. docker-compose.yml).
# ssl_protocols задан один раз глобально в nginx.conf.
#
# Backend (FastAPI, контейнер "backend" в app-net + proxy-net) теперь
# проксируется на 443 под префиксом /api/, плюс временно /docs,
# /docs/oauth2-redirect и /openapi.json для ручного Swagger-тестирования
# (см. комментарии у соответствующих location ниже). Главная "/" пока
# остаётся тем же placeholder, что и раньше — frontend ещё не подключён.

server {
    listen 80;
    listen [::]:80;
    server_name vibe.elivcloud.org;

    # Базовые security-заголовки. HSTS сюда намеренно НЕ добавлен —
    # его включают только после реального перехода на HTTPS, иначе
    # браузер будет форсировать HTTPS на домене, который его пока не
    # обслуживает.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge должен продолжать работать по HTTP —
    # certbot обращается сюда для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Локальный health-эндпоинт для Docker healthcheck (см.
    # docker-compose.yml: wget http://127.0.0.1:80/healthz изнутри
    # контейнера). Намеренно НЕ редиректится на HTTPS — иначе
    # healthcheck зависел бы от того, поддерживает ли busybox wget в
    # образе TLS, что не проверялось (контейнеры в рамках этой сессии
    # не запускались). Наружу это не ослабляет HTTPS-схему: эндпоинт
    # отдаёт только статичный текст "ok", без чувствительных данных —
    # ровно то же самое, что было доступно и до этого патча.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Весь остальной HTTP-трафик — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vibe.elivcloud.org;

    ssl_certificate     /etc/letsencrypt/live/vibe.elivcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.elivcloud.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS сознательно НЕ включён даже здесь — добавьте
    # add_header Strict-Transport-Security ... отдельным шагом, только
    # после того, как реальный smoke-test с VPS подтвердит, что HTTPS
    # стабильно работает для обоих доменов.

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # API backend (FastAPI, см. backend/app/main.py) — backend сам монтирует
    # свои роуты под префиксом /api, поэтому proxy_pass указан БЕЗ URI-части
    # (без завершающего "/" после хоста): это заставляет Nginx передавать
    # исходный $request_uri без изменений, т.е. /api/health -> /api/health
    # на backend, а не /health. "^~" останавливает дальнейшую проверку
    # regex-локаций для всего, что начинается с /api/.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI и OpenAPI-схема — ВРЕМЕННО открыты наружу для ручного
    # тестирования (создание тестовых услуг руками через /docs). Только
    # точечные exact-match локации, без /redoc и без каталога статики.
    # TODO: убрать этот блок (или закрыть его отдельной auth) после
    # завершения учебного тестирования.
    location = /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs/oauth2-redirect {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Главная placeholder-страница — оставлена как есть до появления
    # frontend. Когда он появится, здесь будет проксирование на его
    # сервис вместо статичного текста.
    location / {
        default_type text/plain;
        return 200 "vibe-order-infra: bootstrap, backend ещё не подключён\n";
    }
}
