# Конфигурация для vibe.elivcloud.org.
#
# HTTPS активирован: сертификат Let's Encrypt уже выпущен на VPS и
# монтируется read-only из /etc/letsencrypt (см. docker-compose.yml).
# ssl_protocols задан один раз глобально в nginx.conf.
#
# Backend ещё не реализован, поэтому на 443 намеренно нет proxy_pass —
# он ронял бы Nginx (upstream не резолвился бы). Вместо него — тот же
# безопасный placeholder, что и был на HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name vibe.elivcloud.org;

    # Базовые security-заголовки. HSTS сюда намеренно НЕ добавлен —
    # его включают только после реального перехода на HTTPS, иначе
    # браузер будет форсировать HTTPS на домене, который его пока не
    # обслуживает.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ACME HTTP-01 challenge должен продолжать работать по HTTP —
    # certbot обращается сюда для продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Локальный health-эндпоинт для Docker healthcheck (см.
    # docker-compose.yml: wget http://127.0.0.1:80/healthz изнутри
    # контейнера). Намеренно НЕ редиректится на HTTPS — иначе
    # healthcheck зависел бы от того, поддерживает ли busybox wget в
    # образе TLS, что не проверялось (контейнеры в рамках этой сессии
    # не запускались). Наружу это не ослабляет HTTPS-схему: эндпоинт
    # отдаёт только статичный текст "ok", без чувствительных данных —
    # ровно то же самое, что было доступно и до этого патча.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Весь остальной HTTP-трафик — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vibe.elivcloud.org;

    ssl_certificate     /etc/letsencrypt/live/vibe.elivcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.elivcloud.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS сознательно НЕ включён даже здесь — добавьте
    # add_header Strict-Transport-Security ... отдельным шагом, только
    # после того, как реальный smoke-test с VPS подтвердит, что HTTPS
    # стабильно работает для обоих доменов.

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # Когда появится backend, заменить заглушку на реальный proxy_pass:
    #   location / {
    #       proxy_pass http://backend:PORT;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Real-IP $remote_addr;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #   }
    location / {
        default_type text/plain;
        return 200 "vibe-order-infra: bootstrap, backend ещё не подключён\n";
    }
}
