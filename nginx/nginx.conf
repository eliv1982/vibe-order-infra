user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardening: не раскрывать точную версию Nginx в заголовке Server
    # и на стандартных страницах ошибок.
    server_tokens off;

    # TLS: единожды глобально для всех server{} с listen 443 ssl,
    # чтобы не дублировать в каждом conf.d/*.conf. Только TLS 1.2/1.3 —
    # более старые протоколы не разрешены. Cipher suites оставлены на
    # дефолтах nginx/OpenSSL образа — точечная настройка cipher list/
    # OCSP stapling за рамками этого минимального TLS-патча.
    ssl_protocols TLSv1.2 TLSv1.3;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Docker Registry передаёт крупные слои образов — не ограничиваем тело запроса.
    client_max_body_size 0;

    include /etc/nginx/conf.d/*.conf;
}
