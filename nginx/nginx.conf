user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardening: не раскрывать точную версию Nginx в заголовке Server
    # и на стандартных страницах ошибок.
    server_tokens off;

    # TLS: единожды глобально для всех server{} с listen 443 ssl,
    # чтобы не дублировать в каждом conf.d/*.conf. Только TLS 1.2/1.3 —
    # более старые протоколы не разрешены. Cipher suites оставлены на
    # дефолтах nginx/OpenSSL образа — точечная настройка cipher list/
    # OCSP stapling за рамками этого минимального TLS-патча.
    ssl_protocols TLSv1.2 TLSv1.3;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Rate limiting (Stage 1B) — минимальная защита публичных/auth-
    # эндпоинтов на уровне Nginx, без Redis/дополнительной инфраструктуры
    # (ngx_http_limit_req_module — часть стандартной сборки nginx:1.30-alpine,
    # никаких доп. модулей не требуется).
    #
    # Модель клиентского IP: этот Nginx — САМ внешний, публичный периметр
    # (см. docker-compose.yml: только он публикует 80/443 наружу; перед ним
    # нет доверенного балансировщика/CDN). Поэтому ключом лимита ниже
    # намеренно взят $binary_remote_addr (реальный TCP-peer, который видит
    # сам Nginx), а НЕ $http_x_forwarded_for — этот заголовок мог бы прислать
    # кто угодно напрямую, и доверять ему здесь означало бы, что лимит
    # тривиально обходится подделкой X-Forwarded-For на каждый запрос. Если
    # в будущем перед этим Nginx появится доверенный reverse-proxy/CDN, эту
    # схему нужно пересмотреть через ngx_http_realip_module с explicit
    # allowlist доверенных CIDR (set_real_ip_from) — не просто довериться
    # заголовку.
    #
    # limit_req_status 429 — иначе Nginx по умолчанию отвечает 503 при
    # отказе (неотличимо от "сервис недоступен"); 429 — однозначный сигнал
    # "слишком много запросов" и для браузера, и для клиентского кода.
    #
    # Каждая зона — на конкретный публичный/auth-путь (см. отдельные
    # limit_req в conf.d/vibe.elivcloud.org.conf), плюс одна общая
    # подстраховка на весь /api/. Лимиты подобраны так, чтобы не мешать
    # обычному использованию сайта/админки (burst с nodelay допускает
    # короткий всплеск без задержки, но не бесконечно) — при необходимости
    # значения rate/burst можно точечно скорректировать по факту нагрузки.
    #
    #   login_zone             — POST /api/auth/login: самый строгий лимит,
    #                             т.к. Argon2-верификация пароля намеренно
    #                             дорогая (см. backend/app/core/security.py) —
    #                             без лимита это лёгкая цель для online
    #                             brute-force / DoS через CPU-нагрузку.
    #   applications_zone       — POST /api/applications: умеренный анти-спам
    #                             лимит на публичную форму заявки.
    #   behavior_metrics_zone   — POST /api/behavior-metrics: умеренный лимит
    #                             на публичную отправку behavior-метрик.
    #   api_general_zone        — общая подстраховка на весь /api/ (включая
    #                             защищённые admin-эндпоинты) — разумный
    #                             верхний предел без цели заменить собой
    #                             auth/бизнес-логику.
    #
    # Публичной регистрации (POST /api/auth/register) в API больше нет (см.
    # README/nginx allowlist ниже) — отдельная зона под неё намеренно НЕ
    # заводится: лимитировать несуществующий путь нечего.
    #
    # Stage 1B correction: applications_zone/behavior_metrics_zone должны
    # защищать ТОЛЬКО POST на свои пути (анти-спам для публичной отправки
    # формы/метрик) — а не GET (список заявок/метрик для админки), который
    # делит с POST один и тот же `location = /api/...` (exact-match не
    # различает методы). Раньше обе зоны были заведены на
    # $binary_remote_addr напрямую, поэтому лимит применялся к запросу
    # независимо от метода — быстрый цикл GET-запросов из админки мог
    # словить 429 на том же лимите, что и защита от спама формы.
    #
    # Фикс — стандартный приём Nginx: map превращает ключ зоны в пустую
    # строку для любого метода, кроме POST, а "если значение ключа —
    # пустая строка, лимит к запросу не применяется" (документированное
    # поведение limit_req_zone/limit_conn_zone) — т.е. запрос просто не
    # учитывается и не ограничивается этой конкретной зоной. api_general_zone
    # ниже НЕ участвует в этом map — она обязана продолжать считать все
    # методы (общая подстраховка на весь /api/, включая защищённые
    # admin-эндпоинты), поэтому её ключ остаётся $binary_remote_addr
    # напрямую, без исключений.
    map $request_method $post_only_limit_key {
        POST    $binary_remote_addr;
        default "";
    }

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $post_only_limit_key zone=applications_zone:10m rate=10r/m;
    limit_req_zone $post_only_limit_key zone=behavior_metrics_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=120r/m;

    # Тело запроса НЕ ограничивается здесь глобально. Docker Registry
    # передаёт крупные слои образов и сам задаёт свой собственный
    # unlimited client_max_body_size 0 — на уровне HTTPS server{} (443)
    # в своём отдельном vhost-файле conf.d/registry-vibe.elivcloud.org.conf
    # (НЕ внутри отдельного location — сам этот server{} обслуживает только
    # Registry, поэтому лимит на уровне server{} уже полностью изолирован
    # от основного сайта). Этот override не наследуется основным сайтом —
    # у каждого server{} свой server_name/свой конфиг-файл. Основной сайт
    # (vibe.elivcloud.org) задаёт собственный разумный лимит
    # (client_max_body_size 1m;) внутри своего server{} — см.
    # conf.d/vibe.elivcloud.org.conf. Без явного значения здесь и там
    # действовал бы дефолт nginx (1m), но лимит для основного сайта задан
    # explicitly, чтобы не зависеть от дефолта.
    include /etc/nginx/conf.d/*.conf;
}
