user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardening: не раскрывать точную версию Nginx в заголовке Server
    # и на стандартных страницах ошибок.
    server_tokens off;

    # TLS: единожды глобально для всех server{} с listen 443 ssl,
    # чтобы не дублировать в каждом conf.d/*.conf. Только TLS 1.2/1.3 —
    # более старые протоколы не разрешены. Cipher suites оставлены на
    # дефолтах nginx/OpenSSL образа — точечная настройка cipher list/
    # OCSP stapling за рамками этого минимального TLS-патча.
    ssl_protocols TLSv1.2 TLSv1.3;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Тело запроса НЕ ограничивается здесь глобально. Docker Registry
    # передаёт крупные слои образов и сам задаёт свой собственный
    # unlimited client_max_body_size 0 — на уровне HTTPS server{} (443)
    # в своём отдельном vhost-файле conf.d/registry-vibe.elivcloud.org.conf
    # (НЕ внутри отдельного location — сам этот server{} обслуживает только
    # Registry, поэтому лимит на уровне server{} уже полностью изолирован
    # от основного сайта). Этот override не наследуется основным сайтом —
    # у каждого server{} свой server_name/свой конфиг-файл. Основной сайт
    # (vibe.elivcloud.org) задаёт собственный разумный лимит
    # (client_max_body_size 1m;) внутри своего server{} — см.
    # conf.d/vibe.elivcloud.org.conf. Без явного значения здесь и там
    # действовал бы дефолт nginx (1m), но лимит для основного сайта задан
    # explicitly, чтобы не зависеть от дефолта.
    include /etc/nginx/conf.d/*.conf;
}
