[project]
name = "vibe-order-backend"
version = "0.1.0"
description = "FastAPI backend for vibe-order-infra: client applications, behavior metrics and admin settings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
]

[project.optional-dependencies]
# Dev-only: not installed in the runtime Docker image (Dockerfile runs
# `pip install .`, not `.[test]`), and tests/ is excluded via .dockerignore.
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
