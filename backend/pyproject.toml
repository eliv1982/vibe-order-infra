[project]
name = "vibe-order-backend"
version = "0.1.0"
description = "FastAPI backend for vibe-order-infra: client applications, behavior metrics and admin settings"
requires-python = ">=3.12"
# Stage 3: this pyproject.toml is the source of truth for direct
# dependencies/constraints, but the Docker image (backend/Dockerfile)
# installs from backend/requirements.lock.txt, not from this file directly -
# a pip-compile-generated, hash-verified, fully pinned (incl. transitive)
# closure. backend/requirements-dev.lock.txt is the equivalent for the
# [test] extra below (dev/local/test use only, never installed in the
# runtime image). Regenerate either with the exact command recorded in that
# file's own header comment whenever this dependencies list (or [test])
# changes - see tests/test_dependency_lock_consistency.py for the offline
# regression that catches a forgotten regeneration.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "alembic>=1.18,<1.19",
]

[project.optional-dependencies]
# Dev-only: not installed in the runtime Docker image (Dockerfile runs
# `pip install .`, not `.[test]`), and tests/ is excluded via .dockerignore.
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
