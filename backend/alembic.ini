; Stage 2: Alembic configuration for vibe-order-backend.
;
; Deliberately no `sqlalchemy.url` here - the connection URL is resolved in
; env.py, either from the MIGRATION_DB_USER/MIGRATION_DB_PASSWORD/
; POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB environment variables (the normal
; CLI-invoked case, e.g. `alembic upgrade head` in the db-migrate one-shot
; Compose service) or from a URL set programmatically on the Config object
; before command.upgrade()/command.stamp() is called (the test-suite case -
; see tests/stage2_db_helpers.py). Alembic must NEVER default to the
; runtime application DATABASE_URL (app/core/config.py's Settings) - the
; migration/owner credential and the runtime credential are intentionally
; different roles with different privileges (see app/db_admin/bootstrap_roles.py).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
